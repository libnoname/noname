<!doctype html>

<head>
	<meta charset="UTF-8" />
	<!-- 不自动检查电话号码 -->
	<meta name="format-detection" content="telephone=no" />
	<!-- 手机端网页不显示地址栏 -->
	<meta name="mobile-web-app-capable" content="yes" />
	<!-- 禁止缩放 手机端全屏 -->
	<meta name="viewport" content="user-scalable=no, viewport-fit=cover" />
	<title>无名杀</title>
	<script>
		// iOS PWA / 隐私模式下 localStorage、sessionStorage 可能为 null 或访问抛异常,
		// 而无名杀有上百处直接使用 localStorage(启动时 util/index.js 首行即调用)。
		// 此处在任何模块加载前做兜底:不可用则替换为内存实现,保证游戏不因存储缺失而崩溃。
		// 注意:内存版数据不跨会话持久化(刷新即失),但至少能正常游玩,不再报错白屏。
		(function () {
			"use strict";
			function makeMemoryStorage() {
				var store = Object.create(null);
				return {
					getItem: function (k) {
						k = String(k);
						return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null;
					},
					setItem: function (k, v) {
						store[String(k)] = String(v);
					},
					removeItem: function (k) {
						delete store[String(k)];
					},
					clear: function () {
						store = Object.create(null);
					},
					key: function (i) {
						return Object.keys(store)[i] ?? null;
					},
					get length() {
						return Object.keys(store).length;
					},
				};
			}
			function usable(name) {
				try {
					var s = window[name];
					if (!s) return false;
					var probe = "__noname_probe__";
					s.setItem(probe, "1");
					s.removeItem(probe);
					return true;
				} catch (e) {
					return false;
				}
			}
			["localStorage", "sessionStorage"].forEach(function (name) {
				if (!usable(name)) {
					try {
						Object.defineProperty(window, name, { value: makeMemoryStorage(), configurable: true });
					} catch (e) {
						// defineProperty 失败(极少数环境)时直接赋值兜底
						try {
							window[name] = makeMemoryStorage();
						} catch (e2) {}
					}
				}
			});
		})();
	</script>
	<!-- PWA:可安装 / 独立窗口 / 离线 -->
	<link rel="manifest" href="./manifest.webmanifest" />
	<meta name="theme-color" content="#000000" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="无名杀" />
	<link rel="apple-touch-icon" href="./image/pwa/apple-touch-icon.png" />
	<link rel="icon" type="image/png" href="./image/pwa/icon-192.png" />
	<script>
		// 注册 PWA Service Worker(离线缓存)。失败不影响游戏运行。
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", async () => {
				// 一次性清理：旧版误注册的 JIT service-worker.js 会抢占 scope 导致白屏，
				// 找到它并注销掉，让 pwa-sw.js 重新接管。
				try {
					const regs = await navigator.serviceWorker.getRegistrations();
					for (const reg of regs) {
						if (reg.active && reg.active.scriptURL.endsWith('/service-worker.js')) {
							await reg.unregister();
							console.log('[PWA] 已注销残留的 JIT service-worker.js');
						}
					}
				} catch (e) { /* ignore */ }
				navigator.serviceWorker.register("./pwa-sw.js").catch(err => console.warn("PWA SW 注册失败:", err));
			});
			// 【不要再加 controllerchange → location.reload()】曾加过(57e310a),纯亏本已回退:
			//  - 它想解决"首次打开时页面未受控、请求绕过 SW",但离线那次打开时 SW 早已 active,
			//    页面天然受控 —— 对离线白屏毫无用处(TROUBLESHOOTING 早记过这条教训)。
			//  - 代价是每次新版 SW 接管就整页重载一次 → 部署后首次打开耗时翻倍(实测明显变慢)。
			//  - 且 sessionStorage 若退化成内存实现(见本文件顶部兜底),getItem 恒为 null → 无限 reload。
		}
	</script>
	<script>
		"use strict";
		(() => {
			window.onerror = function (msg, src, line, column, err) {
				// 忽略"音频/视频自动播放被浏览器拦截"这类无害错误(NotAllowedError):
				// 浏览器/iOS 安全策略不允许无交互自动播放,用户点一下即恢复,不该弹窗打扰。
				const errName = (err && err.name) || "";
				const msgStr = String(msg || "");
				if (errName === "NotAllowedError" || msgStr.includes("NotAllowedError") || msgStr.includes("not allowed by the user agent")) {
					console.warn("[忽略无害错误] 媒体自动播放被拦截:", msgStr);
					return;
				}
				let str = `错误文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知文件"}`;
				str += `\n错误信息: ${msg}`;
				str += `\n行号: ${line}`;
				str += `\n列号: ${column}`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				alert(str);
			};
			const STACK_REGEXP = /^\s*at .*(\S+:\d+|\(native\))/m;
			const errorList = [];
			function extractLocation(urlLike) {
				// 不存在地址信息的字符串
				if (!/:/.test(urlLike)) {
					return [urlLike];
				}

				// 捕获位置用到的正则
				const regExp = /(.+?)(?::(\d+))?(?::(\d+))?$/;
				const parts = regExp.exec(urlLike.replace(/[()]/g, ""));

				// @ts-ignore
				return [parts[1], parts[2] || void 0, parts[3] || void 0];
			}
			window.onunhandledrejection = async event => {
				event.promise.catch(error => {
					console.log(error);
					// 如果`error`是个错误，则继续处理
					if (error instanceof Error) {
						// 如果已经处理过该错误，则不再处理
						if (errorList.includes(error)) return;
						errorList.push(error);
						// 如果`error`拥有字符串形式的报错栈堆，且报错栈堆确实符合v8的stack
						if (typeof error.stack === "string" && STACK_REGEXP.test(error.stack)) {
							// 获取符合栈堆信息的字符串，一般来说就是从第二行开始的所有行
							// 为了处理eval的情况，故必须获取完行数
							let lines = error.stack.split("\n").filter(line => STACK_REGEXP.test(line));

							// 提供类型信息防止vscode报错
							/**
							 * @type {string | undefined}
							 */
							let fileName = void 0;

							/**
							 * @type {number | undefined}
							 */
							let line = void 0;

							/**
							 * @type {number | undefined}
							 */
							let column = void 0;

							// 从第一条开始遍历，一直遍历到不存在eval的位置
							for (let currentLine = 0; currentLine < lines.length; ++currentLine) {
								if (/\(eval /.test(lines[currentLine])) continue;

								let formatedLine = lines[currentLine]
									.replace(/^\s+/, "")
									.replace(/\(eval code/g, "(")
									.replace(/^.*?\s+/, "");

								const location = formatedLine.match(/ (\(.+\)$)/);
								if (location) formatedLine = formatedLine.replace(location[0], "");

								const locationParts = extractLocation(location ? location[1] : formatedLine);

								fileName = ["eval", "<anonymous>"].includes(locationParts[0]) ? void 0 : locationParts[0];
								line = Number(locationParts[1]);
								column = Number(locationParts[2]);
								break;
							}

							// @ts-ignore
							window.onerror(error.message, fileName, line, column, error);
						}
						// 反之我们只能不考虑报错文件信息，直接调用onerror
						else {
							try {
								// @ts-ignore
								let [_, src = void 0, line = void 0, column = void 0] = /at\s+.*\s+\((.*):(\d*):(\d*)\)/i.exec(error.stack.split("\n")[1]);
								if (typeof line == "string") line = Number(line);
								if (typeof column == "string") column = Number(column);
								// @ts-ignore
								window.onerror(error.message, src, line, column, error);
							} catch (e) {
								window.onerror(error.message, "", 0, 0, error);
							}
						}
					}
				});
			};
		})();
	</script>
	<script type="module" src="./noname/entry.ts"></script>
</head>
