name: Build unsigned iOS IPA

# 用途：在没有 Mac（或 Mac 太老装不了新 Xcode）的情况下，用 GitHub 免费提供的
# macOS 云端机器把《无名杀》编译成未签名的 .ipa，再交给 SideStore / AltStore
# 用你自己的 Apple ID 重签安装。
#
# 为什么必须是「未签名」的 ipa：
#   CI 上没有你的开发者证书，xcodebuild 无法完成签名。但 SideStore 本来就会
#   用你自己的 Apple ID 重新签名，所以未签名的 ipa 正是它需要的输入格式。
#
# 为什么用 macos-26 而不是 macos-15：
#   Capacitor 8 的 iOS 模板使用 Swift Package Manager，要求 Xcode 26.0+；
#   macos-26 镜像自带 Xcode 26.x，正好满足。这个组合也顺带解决了
#   「Intel Mac 无法安装 Xcode 26」的问题——云端机器是 Apple Silicon。
#
# 双包的体积策略：
#   精简包为控制体积排除武将原画与语音——侧载工具对未压缩 App 体积敏感
#   （AltStore 未打补丁时 >300MB 的 ipa 直接报 Bad Allocation；即使打 4GB patch，
#   Apple 侧未压缩 App 硬上限仍是 4GB）。audio/skill(470M) + image/character(390M)
#   + audio/die(111M) 约 1GB，改由游戏内「边玩边下」按需补齐
#   （实现见 apps/mobile/src/lazy-assets.ts）。
#   完整包（build-ipa-full 任务）全量携带这些资源，并在构建期设置
#   NONAME_FULL_ASSETS=1，把「下载素材」功能整体从产物中剔除——
#   preload 不再打包下载器模块，也不再生成 asset-download-manifest.json。
#
# 触发方式（三选一）：
#   ① 推送到 feat/ios-support 分支即自动构建 —— 配合 sync-upstream 每晚合并，
#      与 cloudflare-pages 的推送自动部署共同构成「每晚同步 → iOS/网页自动更新」闭环，
#      维护者日常无需任何人工介入；
#   ② 打 ios-v* tag 时自动构建（用于人工指定版本号发版）；
#   ③ GitHub 网页 → Actions → “Build unsigned iOS IPA” → Run workflow（手动触发）。
# 产物位置：运行页面底部的 Artifacts；同时会附到自动创建的 Release 上。
#
# 版本号规则（详见仓库根目录《无名杀 iOS 操作手册》）：
#   Actions 发布的 Release 一律视为小版本号递增，初始 v1.0.0，此后 patch +1
#   （v1.0.0 → v1.0.1 → v1.0.2 …），标题与说明同时标注所对应的上游版本；
#   以 ios-v* tag 触发时，版本号以 tag 名为准，不参与上述自动递增。
#
# 详细说明与本地构建方式见本仓库根目录的《无名杀 iOS 操作手册》：
# https://github.com/cklsit/noname/blob/main/%E6%97%A0%E5%90%8D%E6%9D%80iOS%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8C.md

on:
  # 手动触发（推荐）
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Artifact 保留天数（1-90）"
        required: false
        default: "14"
      create_release:
        description: "是否把 ipa 同时发到 Release"
        type: boolean
        required: false
        default: true
  # 自动触发：
  #   ① 推送到 feat/ios-support 即构建（配合 sync-upstream 每晚合并 → 每晚自动更新；
  #      与 cloudflare-pages 的推送自动部署共同构成「同步即更新」闭环）；
  #   ② 打 ios-v* tag 时构建（人工指定版本）。
  push:
    tags:
      - "ios-v*"
    branches:
      - feat/ios-support

permissions:
  contents: write # 创建 Release 需要

# 并发控制：同 ref 只保留一个构建。版本号在发布步骤按「现有 Release」计算并 +0.0.1，
# 串行可避免两次构建并发算出同一个版本号、发布时 tag 撞车。
concurrency:
  group: "ios-build-${{ github.ref }}"
  cancel-in-progress: false

# 双包策略（2026-10-19 起，两任务并行）：
#   job build-ipa      → 精简包 noname-ios-unsigned.ipa（不含原画/语音，游戏内按需下载）
#   job build-ipa-full → 完整包 noname-ios-full-unsigned.ipa（含全部原画与台词语音）
#   两任务并行（互不阻塞，墙钟时间 = 较慢者）；完整任务在开始时用与精简任务相同的算法
#   计算版本号，构建完成后等待精简任务创建对应 Release，再把自己的 ipa 附加进去。
#   完整任务另设 NONAME_FULL_ASSETS=1：preload 产物剔除「下载素材」模块、
#   不生成补充下载清单（两个任务内均以 Verify 步骤自校验，见下）。
jobs:
  build-ipa:
    name: Build unsigned IPA
    # macos-26 自带 Xcode 26.x，满足 Capacitor 8 的要求（Capacitor 8 的 iOS 模板
    # 改用 Swift Package Manager，最低 Xcode 26.0，且不再需要 CocoaPods）。
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Show runner info and free disk
        run: |
          echo "===== Runner ====="
          uname -a
          sw_vers
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== Disk before checkout ====="
          df -h /

      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          # ⚠️ 极其关键：本仓库 Git 历史巨大（约 2.6TB），
          # 必须用 depth=1 只拉最新一个 commit，否则会耗尽 runner 磁盘。
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Disk after checkout
        run: df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts 跳过 electron 等无关平台重活，加快安装。
        # --prefer-offline：优先用本地 pnpm store / setup-node 拉回的缓存，命中时省去
        # 远端元数据往返。收益小但无副作用（lockfile 未变时等价于 --frozen-lockfile）。
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Disk after install
        run: df -h /

      - name: Build web assets (dist/)
        # 注：不缓存 Vite 构建产物 —— node_modules/.vite 是 dev server 的 dep optimizer 缓存，
        # vite build 不会写它（实测该缓存从未被保存）。
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Disk after web build
        run: |
          df -h /
          du -sh dist

      - name: Verify iOS Capacitor project
        working-directory: apps/mobile
        # iOS 工程（apps/mobile/ios）已随仓库提交，与 android/ 的处理方式保持一致。
        # 这样做是为了在其中维护原生代码（NonameBridgeViewController / NonameRouter 等），
        # 实现安卓 JsAwareAssetsPathHandler 等价的「可写覆盖层 + 扩展加载」能力。
        #
        # 如果目录缺失（例如贡献者删掉了、或 checkout 不完整），就回退到现场生成，
        # 保证构建不至于完全跑不起来；但此时原生修改不会被应用，因此给出明确提示。
        env:
          CI: "true"
        run: |
          if [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "iOS 工程已存在于仓库中 ✓"
            ls -la ios/App/App/*.swift
          else
            echo "::warning::仓库里没有 ios/ 工程，回退为现场生成（原生覆盖层修改将不会生效）"
            npx cap add ios
          fi

      - name: Capacitor sync
        working-directory: apps/mobile
        # afterSync.ts 内部顺序：buildPreload() → writeAssetManifest() → capSync()
        # 这一步会把 preload.js 与 dist 全量资源同步进 ios/App/App/public。
        # 资源裁剪放在下一步，裁剪后再用 `cap copy` 重拷一次覆盖。
        run: pnpm sync

      # Capacitor 8 使用 Swift Package Manager，默认只生成 apps/mobile/ios/App/App.xcodeproj，
      # 不再有带 Pods 的 App.xcworkspace。这里同时兼容两种布局：
      # 优先用 .xcworkspace（若存在），否则回退到 .xcodeproj。
      - name: Locate iOS project
        id: ios
        working-directory: apps/mobile/ios
        run: |
          echo "===== ios 目录结构 ====="
          find . -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) | sort

          # 先找 workspace（必须是 *.xcodeproj 同级的那个，排除 xcodeproj 内部自带的）
          WS=$(find . -maxdepth 3 -type d -name "*.xcworkspace" \
                 ! -path "*.xcodeproj/*" | head -n1)

          if [ -n "$WS" ]; then
            TARGET="$WS"
            MODE=workspace
          else
            # Capacitor 8 / SPM 布局：直接用 App.xcodeproj
            PROJ=$(find . -maxdepth 3 -type d -name "*.xcodeproj" \
                     ! -path "*.xcodeproj/*" | head -n1)
            if [ -z "$PROJ" ]; then
              echo "::error::既找不到 .xcworkspace 也找不到 .xcodeproj"
              find . -maxdepth 4 -type d || true
              exit 1
            fi
            TARGET="$PROJ"
            MODE=project
          fi

          # 归一化去掉开头的 ./ ，避免拼出 apps/mobile/ios/./App 这类路径
          PROJ_DIR=$(dirname "$TARGET")
          PROJ_DIR=${PROJ_DIR#./}
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target=$(basename "$TARGET")" >> "$GITHUB_OUTPUT"
          echo "app_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "Found $MODE: $TARGET (dir: $PROJ_DIR)"

          # 安全校验：目标目录里必须真的存在 xcodeproj，否则说明选错了位置
          if ! ls "$PROJ_DIR"/*.xcodeproj >/dev/null 2>&1; then
            echo "::error::$PROJ_DIR 下没有 .xcodeproj，说明选错了目录。"
            ls -la "$PROJ_DIR"
            exit 1
          fi
          echo ".xcodeproj found in $PROJ_DIR ✓"

      - name: Strip character art and voice
        working-directory: apps/mobile
        run: |
          # 侧载工具对未压缩 App 体积非常敏感：
          #   - AltStore 未打补丁时 >300MB 的 ipa 直接报 Bad Allocation
          #   - 即使打 4GB patch，Apple 侧未压缩 App 硬上限仍是 4GB
          # 本仓库全量资源约 2.8GB，不处理几乎必然装不上。
          #
          # ⚠️ 本步骤只服务精简包（完整包任务不含此步骤）：
          # 精简包不带武将原画与语音，改为游戏内「边玩边下」——
          # 用到谁就只下谁（详见 apps/mobile/src/lazy-assets.ts）。
          #
          # 处理的对象（缺失不影响开局可玩性，且都有内置兜底）：
          #   audio/skill       470M  武将技能语音（全为 mp3，整目录删）
          #   audio/die         111M  阵亡语音（全为 mp3，整目录删）
          #   image/character   390M  武将立绘（保留 3 张 default_silhouette_*）
          DIST=../../dist
          # 同步进 iOS 工程的资源目录（排除 xcodeproj 内部的干扰路径）
          PUBLIC=$(find ios -maxdepth 5 -type d -path "*/App/public" \
                     ! -path "*.xcodeproj/*" | head -n1)
          echo "dist=$DIST public=$PUBLIC"
          if [ -z "$PUBLIC" ]; then
            echo "::error::找不到 iOS 工程内的 public 目录，无法裁剪。"
            find ios -maxdepth 4 -type d ! -path "*.xcodeproj/*" || true
            exit 1
          fi
          echo "===== 处理前 ====="
          du -sh "$DIST"
          du -sh "$PUBLIC" 2>/dev/null || true

          # 同时删 dist 与已同步进 iOS 工程的那一份。
          # 注意：`cap copy` 只做增量拷贝，不会清理目标目录里的多余文件，
          # 所以必须显式删除 iOS 工程内的对应目录，否则瘦身形同虚设。
          for TARGET in "$DIST" "$PUBLIC"; do
            [ -d "$TARGET" ] || continue

            # 语音类可以整目录删除（目录内全是 mp3，无必需文件）
            rm -rf "$TARGET/audio/skill"
            rm -rf "$TARGET/audio/die"

            # 武将立绘目录里有 3 张游戏必需的默认剪影
            # （characterDefaultPicturePath = image/character/default_silhouette_），
            # 不能整个目录删掉，否则未提供立绘的武将会显示破图。
            # 做法：把必需的 3 张剪影先挪到临时区，删目录后再放回原位置。
            if [ -d "$TARGET/image/character" ]; then
              TMP_KEEP=$(mktemp -d)
              find "$TARGET/image/character" -maxdepth 1 -name 'default_silhouette_*' -exec cp {} "$TMP_KEEP/" \; 2>/dev/null || true
              rm -rf "$TARGET/image/character"
              mkdir -p "$TARGET/image/character"
              cp "$TMP_KEEP"/default_silhouette_* "$TARGET/image/character/" 2>/dev/null || true
              rm -rf "$TMP_KEEP"
            fi
          done

          echo "===== 处理后 ====="
          du -sh "$DIST"
          du -sh "$PUBLIC" 2>/dev/null || true
          du -sh "$DIST"/* | sort -rh | head -10

          # 资源变了，asset-manifest.json 必须同步重建（dist 与 iOS 工程两份都要），
          # 否则运行时会尝试读取已删除的文件。
          rebuild_manifest() {
            ROOT="$1" node -e "
          const fs=require('fs'),path=require('path');
          const root=process.env.ROOT, out=path.resolve(root,'asset-manifest.json');
          const ignored=new Set(['asset-manifest.json','preload.js','node_modules']);
          const entries=[];
          (function walk(dir){
            for(const name of fs.readdirSync(dir)){
              if(ignored.has(name)) continue;
              const abs=path.join(dir,name);
              if(fs.statSync(abs).isDirectory()){ walk(abs); continue; }
              entries.push(path.relative(root,abs).split(path.sep).join('/'));
            }
          })(root);
          entries.sort();
          fs.writeFileSync(out, JSON.stringify(entries)+'\n');
          console.log(root + ' asset-manifest.json: ' + entries.length + ' entries');
          "
          }

          rebuild_manifest "$DIST"
          if [ -d "$PUBLIC" ]; then rebuild_manifest "$PUBLIC"; fi

          # 把裁剪后的 dist（含新清单）覆盖同步到 iOS 工程。
          # preload.js 未变化，无需重建。
          npx cap copy ios

      # P0-1：原步骤名为 `Show project and scheme`，里面除了 `ls -la` 还跑了一次
      # `xcodebuild -list`（-workspace/-project 二选一）。实测该命令独占约 18s —— 它会
      # 完整加载工程并触发一次 Swift Package Manager 依赖解析，而该命令只是用来打印 scheme 名，
      # 对本工作流没有任何决策作用（下面 xcodebuild 里 scheme 名恒为 App）。
      # 因此整段删除，只保留廉价的目录列表。工程存在性已由 `Locate iOS project` 步骤
      # 用 `.xcodeproj` 校验兜底，信息没有丢失。
      - name: Show project directory
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        run: ls -la

      # P1-1：缓存 Swift Package Manager 的依赖检出与编译产物。
      # ⚠️ 缓存 key 的关键修正：不要用 Package.resolved 做哈希输入 —— 本仓库
      #   `apps/mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/` 下只有
      #   IDEWorkspaceChecks.plist，根本没有 Package.resolved 文件，`hashFiles(...)` 会恒返回
      #   空串，导致 key 退化（永远 miss 或永远命中旧缓存）。
      # 因此改用 `CapApp-SPM/Package.swift` 作为哈希输入之一。⚠️ 更正：该文件并未被版本管理
      #   （见 apps/mobile/.gitignore:30 —— Capacitor CLI 每次 `cap sync` 都会重写这份 SPM 清单，
      #   它会写入本机 node_modules 的绝对/相对路径，提交后在别的机器/CI 上路径必然失效，故不纳入
      #   版本管理、交给 cap sync 现场生成）。但它正是第 12 步 `Capacitor sync` 现场生成的，而本步骤
      #   排在其后，因此 `hashFiles()` 能取到真实的依赖指纹，不会退化成空串。它显式列出了
      #   capacitor-swift-pm 8.1.0 及两个本地 path 依赖，足以代表 SPM 依赖指纹。
      # ⚠️ 又因它是生成物（万一某次 `pnpm sync` 异常未生成，key 会退化），key 里同时加入恒被
      #   版本管理的 pnpm-lock.yaml：`hashFiles` 接受多个参数，任一文件缺失时它对该文件返回空串、
      #   其余仍参与计算，因此 key 不会整体退化为空串，也就不会误撞过期缓存。
      # 命中后 xcodebuild 可跳过 `swift package resolve` 的网络拉取，第二次运行起见效。
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build unsigned archive
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        run: |
          set -o pipefail

          # 提前体检：若可用空间不足 5GB，直接给出明确结论，
          # 避免 xcodebuild 在磁盘写满时抛出难以排查的报错。
          AVAIL_KB=$(df -k / | awk 'NR==2 {print $4}')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available disk: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 5 ]; then
            echo "::error::磁盘不足（仅剩 ${AVAIL_GB} GB）。本仓库 Git 历史过大，请参考 workflow 顶部注释。"
            du -sh . 2>/dev/null || true
            exit 1
          fi

          # 根据探测结果决定用 -workspace 还是 -project
          if [ "${{ steps.ios.outputs.mode }}" = "workspace" ]; then
            TARGET_FLAG="-workspace"
          else
            TARGET_FLAG="-project"
          fi

          # CODE_SIGNING_ALLOWED=NO 是核心：没有证书也能编译出 .app
          #
          # P0-2：只编 arm64 + 关闭调试符号。
          #   - 侧载到真机只需 arm64；原值 ONLY_ACTIVE_ARCH=NO 会 arm64 + x86_64 双架构编译，
          #     白白多花一份时间，因此改为 ONLY_ACTIVE_ARCH=YES。
          #   - 必须显式再给 ARCHS=arm64 与 EXCLUDED_ARCHS：在 `generic/platform=iOS`
          #     destination 下 ONLY_ACTIVE_ARCH 有时会被忽略，不显式指定 ARCHS 会报
          #     "No architectures to compile for ..."。
          #   - DEBUG_INFORMATION_FORMAT=dwarf + GCC_GENERATE_DEBUGGING_SYMBOLS=NO：跳过 dSYM
          #     生成（侧载 ipa 用不到符号表）。COPY_PHASE_STRIP / STRIP_INSTALLED_PRODUCT：
          #     剥离已安装产物，在关闭 DEBUG_INFO 后可以安全生效。
          #   - -quiet：减少 CI 日志 I/O（原有 `set -o pipefail` 保留）。
          #   - -clonedSourcePackagesDirPath：把 SPM 依赖检出指向缓存目录（见上一步 Cache SPM packages）。
          # ❌ 故意不加 DEPLOYMENT_POSTPROCESSING=YES：它会触发额外 strip 后处理，某些第三方
          #   Swift 包在链接期依赖符号表时可能报错，收益不明确、风险明确，本次不做。
          # 其余签名相关参数（CODE_SIGNING_ALLOWED/REQUIRED、CODE_SIGN_IDENTITY/ENTITLEMENTS、
          # AD_HOC_CODE_SIGNING_ALLOWED）与 -derivedDataPath 一律原样保留。
          xcodebuild \
            $TARGET_FLAG "${{ steps.ios.outputs.target }}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="i386 x86_64" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            -quiet \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found. Build output:"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"

          IPA_NAME="noname-ios-unsigned"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"

          # 顺手剥掉 macOS 的扩展属性文件，减小体积
          find "$BUILD_DIR/Payload" -name "._*" -delete || true

          cd "$BUILD_DIR"
          # 压缩级别说明（实测后已回退，勿再改回 -1）：曾试过 `zip -1`（level 1），A/B 实测
          # `Package unsigned IPA` 只从 21s 降到 20s（约 1s，落在噪声范围内），却让 ipa 从
          # 293,322,687 字节涨到 298,350,006 字节（+5.0MB, +1.7%）。本项目用户是在 30-100 KB/s
          # 的慢链路上手工下载该包，多 5MB 约等于多等 1-2 分钟，而 CI 只快 1 秒 —— 对该项目属
          # 负收益，故回退为默认级别（`-qry`）。
          # ❌ 故意不用 ditto -c -k --sequesterRsrc：--sequesterRsrc 会写入 __MACOSX
          #    资源叉条目，侧载工具对 ipa 内部结构敏感，不值得冒这个险。
          # 保留 -x 排除项，语义与原始一致（额外显式排除 .DS_Store）。
          zip -qry "$IPA_NAME.ipa" Payload -x '*.DS_Store' -x '*/._*'

          echo "IPA size:"
          du -h "$IPA_NAME.ipa"
          ls -lh "$IPA_NAME.ipa"

          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify asset-downloader bundled (slim)
        # 精简包必须带「下载素材」功能：preload 产物里应出现下载器模块的标记串。
        run: |
          if ! grep -q 'asset-download-manifest.json' dist/preload.js; then
            echo "::error::精简包 preload.js 缺少下载器代码（构建开关可能被误开）"
            exit 1
          fi
          echo "精简包：下载器已打包 ✓"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: noname-ios-unsigned
          path: ${{ steps.package.outputs.ipa_path }}
          # workflow_dispatch 时用用户填的天数；tag 触发时 inputs 为空，回退到 14 天
          retention-days: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.retention_days) || 14 }}
          if-no-files-found: error

      - name: Publish to Release
        id: release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          set -euo pipefail
          # 版本号规则：初始 1.0.0；无论 feat/fix，Actions 发布的 Release 一律视为小版本号 +0.0.1。
          # 版本号 = 现有 Release 中最大 semver（v?X.Y.Z）的 patch+1；无则 1.0.0。
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="iOS unsigned ${{ github.ref_name }}"
            VERSION_LINE="**版本**：${{ github.ref_name }}（tag 触发）"
          else
            tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null || true)
            next=$(printf '%s\n' "$tags" \
              | sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+)$/\1 \2 \3/p' \
              | awk 'NF==3 { if (maj=="" || $1>maj || ($1==maj && ($2>mid || ($2==mid && $3>pat)))) { maj=$1; mid=$2; pat=$3 } } END { if (maj=="") print "1.0.0"; else print maj "." mid "." (pat+1) }')
            upstream_tag=$(gh api repos/libnoname/noname/releases/latest --jq .tag_name 2>/dev/null || echo "未知")
            upstream_sha=$(gh api repos/libnoname/noname/commits/main --jq '.sha[0:8]' 2>/dev/null || echo "未知")
            TAG="v${next}"
            TITLE="iOS unsigned ${next}（上游 ${upstream_tag}）"
            VERSION_LINE="**版本**：${next}（对应上游 \`libnoname/noname\` ${upstream_tag}，main@${upstream_sha}）"
          fi
          echo "Release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 标签已存在就复用，否则新建
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading asset only."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$VERSION_LINE

          **本 Release 提供两个包**：
          - `noname-ios-unsigned.ipa`（**精简包**，推荐）：不含武将原画、技能语音与阵亡语音，
            游戏内按需下载（需要联网，首次遇到某个武将时略有延迟）
          - `noname-ios-full-unsigned.ipa`（**完整包**）：包含全部武将原画与台词语音，
            无需联网补素材（体积较大；由同一晚的另一个构建任务自动附加到本 Release）

          未签名 iOS ipa（GitHub Actions 自动构建，commit ${{ github.sha }}）。

          **安装方式**：把任一 .ipa 导入 SideStore / AltStore，用你自己的 Apple ID 重签后安装。

          ⚠️ 未签名包无法直接安装，必须经过侧载工具重签。免费 Apple ID 签名的应用 7 天后过期，需要重新刷新。"
          fi

          gh release upload "$TAG" "$IPA_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        env:
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          {
            echo "## iOS 未签名 IPA 构建完成 ✅"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 产物 | \`noname-ios-unsigned.ipa\`（精简包） |"
            echo "| 完整包 | \`noname-ios-full-unsigned.ipa\`（另一任务构建，成功后自动附加） |"
            echo "| 大小 | ${IPA_SIZE} |"
            echo "| 签名 | 未签名（需 SideStore/AltStore 重签） |"
            echo "| Xcode | $(xcodebuild -version | head -n1) |"
            echo ""
            echo "下载：本页底部 **Artifacts**，或 [Releases](https://github.com/$GITHUB_REPOSITORY/releases)。"
            echo ""
            echo "> 装到 iPhone 的步骤见[《无名杀 iOS 操作手册》](https://github.com/cklsit/noname/blob/main/%E6%97%A0%E5%90%8D%E6%9D%80iOS%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8C.md)。"
          } >> "$GITHUB_STEP_SUMMARY"

  build-ipa-full:
    name: Build unsigned IPA (full assets)
    # macos-26 自带 Xcode 26.x，满足 Capacitor 8 的要求（Capacitor 8 的 iOS 模板
    # 改用 Swift Package Manager，最低 Xcode 26.0，且不再需要 CocoaPods）。
    runs-on: macos-26
    timeout-minutes: 90
    if: github.event_name == 'push' || inputs.create_release
    env:
      # 完整包：剔除「下载素材」功能（preload 不打包下载器、不生成补充下载清单）
      NONAME_FULL_ASSETS: "1"

    steps:
      - name: Resolve release tag
        # 两任务并行：这里在运行开始时就确定版本号（此时精简任务尚未创建 Release，
        # 两边读到的现有 Release 列表一致 → 得到同一个 vX.Y.Z）。
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null || true)
            next=$(printf '%s\n' "$tags" \
              | sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+)$/\1 \2 \3/p' \
              | awk 'NF==3 { if (maj=="" || $1>maj || ($1==maj && ($2>mid || ($2==mid && $3>pat)))) { maj=$1; mid=$2; pat=$3 } } END { if (maj=="") print "1.0.0"; else print maj "." mid "." (pat+1) }')
            TAG="v${next}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次目标 Release：$TAG"

      - name: Show runner info and free disk
        run: |
          echo "===== Runner ====="
          uname -a
          sw_vers
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== Disk before checkout ====="
          df -h /

      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          # ⚠️ 极其关键：本仓库 Git 历史巨大（约 2.6TB），
          # 必须用 depth=1 只拉最新一个 commit，否则会耗尽 runner 磁盘。
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Disk after checkout
        run: df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts 跳过 electron 等无关平台重活，加快安装。
        # --prefer-offline：优先用本地 pnpm store / setup-node 拉回的缓存，命中时省去
        # 远端元数据往返。收益小但无副作用（lockfile 未变时等价于 --frozen-lockfile）。
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Disk after install
        run: df -h /

      - name: Build web assets (dist/)
        # 注：不缓存 Vite 构建产物 —— node_modules/.vite 是 dev server 的 dep optimizer 缓存，
        # vite build 不会写它（实测该缓存从未被保存）。
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Disk after web build
        run: |
          df -h /
          du -sh dist

      - name: Verify iOS Capacitor project
        working-directory: apps/mobile
        # iOS 工程（apps/mobile/ios）已随仓库提交，与 android/ 的处理方式保持一致。
        # 这样做是为了在其中维护原生代码（NonameBridgeViewController / NonameRouter 等），
        # 实现安卓 JsAwareAssetsPathHandler 等价的「可写覆盖层 + 扩展加载」能力。
        #
        # 如果目录缺失（例如贡献者删掉了、或 checkout 不完整），就回退到现场生成，
        # 保证构建不至于完全跑不起来；但此时原生修改不会被应用，因此给出明确提示。
        env:
          CI: "true"
        run: |
          if [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "iOS 工程已存在于仓库中 ✓"
            ls -la ios/App/App/*.swift
          else
            echo "::warning::仓库里没有 ios/ 工程，回退为现场生成（原生覆盖层修改将不会生效）"
            npx cap add ios
          fi

      - name: Capacitor sync
        working-directory: apps/mobile
        # afterSync.ts 内部顺序：buildPreload() → writeAssetManifest() → capSync()
        # 这一步会把 preload.js 与 dist 全量资源同步进 ios/App/App/public（完整包不做裁剪）。
        run: pnpm sync

      - name: Verify asset-downloader removed (full)
        # 完整包必须不含「下载素材」功能：preload 产物与补充下载清单都不应出现。
        run: |
          if grep -q 'asset-download-manifest.json' dist/preload.js; then
            echo "::error::完整包 preload.js 仍包含下载器代码（NONAME_FULL_ASSETS 未生效）"
            exit 1
          fi
          if [ -e dist/asset-download-manifest.json ]; then
            echo "::error::完整包不应生成 asset-download-manifest.json"
            exit 1
          fi
          echo "完整包：下载器已剔除 ✓"

      - name: Free disk
        # dist 已全量同步进 iOS 工程，删掉工作区副本可释放约 1.5GB，
        # 给 xcodebuild 的 DerivedData 留足空间（完整包场景磁盘压力明显高于精简包）。
        run: |
          du -sh dist
          rm -rf dist
          df -h /

      # Capacitor 8 使用 Swift Package Manager，默认只生成 apps/mobile/ios/App/App.xcodeproj，
      # 不再有带 Pods 的 App.xcworkspace。这里同时兼容两种布局：
      # 优先用 .xcworkspace（若存在），否则回退到 .xcodeproj。
      - name: Locate iOS project
        id: ios
        working-directory: apps/mobile/ios
        run: |
          echo "===== ios 目录结构 ====="
          find . -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) | sort

          # 先找 workspace（必须是 *.xcodeproj 同级的那个，排除 xcodeproj 内部自带的）
          WS=$(find . -maxdepth 3 -type d -name "*.xcworkspace" \
                 ! -path "*.xcodeproj/*" | head -n1)

          if [ -n "$WS" ]; then
            TARGET="$WS"
            MODE=workspace
          else
            # Capacitor 8 / SPM 布局：直接用 App.xcodeproj
            PROJ=$(find . -maxdepth 3 -type d -name "*.xcodeproj" \
                     ! -path "*.xcodeproj/*" | head -n1)
            if [ -z "$PROJ" ]; then
              echo "::error::既找不到 .xcworkspace 也找不到 .xcodeproj"
              find . -maxdepth 4 -type d || true
              exit 1
            fi
            TARGET="$PROJ"
            MODE=project
          fi

          # 归一化去掉开头的 ./ ，避免拼出 apps/mobile/ios/./App 这类路径
          PROJ_DIR=$(dirname "$TARGET")
          PROJ_DIR=${PROJ_DIR#./}
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target=$(basename "$TARGET")" >> "$GITHUB_OUTPUT"
          echo "app_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "Found $MODE: $TARGET (dir: $PROJ_DIR)"

          # 安全校验：目标目录里必须真的存在 xcodeproj，否则说明选错了位置
          if ! ls "$PROJ_DIR"/*.xcodeproj >/dev/null 2>&1; then
            echo "::error::$PROJ_DIR 下没有 .xcodeproj，说明选错了目录。"
            ls -la "$PROJ_DIR"
            exit 1
          fi
          echo ".xcodeproj found in $PROJ_DIR ✓"

      # P0-1：原步骤名为 `Show project and scheme`，里面除了 `ls -la` 还跑了一次
      # `xcodebuild -list`（-workspace/-project 二选一）。实测该命令独占约 18s —— 它会
      # 完整加载工程并触发一次 Swift Package Manager 依赖解析，而该命令只是用来打印 scheme 名，
      # 对本工作流没有任何决策作用（下面 xcodebuild 里 scheme 名恒为 App）。
      # 因此整段删除，只保留廉价的目录列表。工程存在性已由 `Locate iOS project` 步骤
      # 用 `.xcodeproj` 校验兜底，信息没有丢失。
      - name: Show project directory
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        run: ls -la

      # P1-1：缓存 Swift Package Manager 的依赖检出与编译产物。
      # ⚠️ 缓存 key 的关键修正：不要用 Package.resolved 做哈希输入 —— 本仓库
      #   `apps/mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/` 下只有
      #   IDEWorkspaceChecks.plist，根本没有 Package.resolved 文件，`hashFiles(...)` 会恒返回
      #   空串，导致 key 退化（永远 miss 或永远命中旧缓存）。
      # 因此改用 `CapApp-SPM/Package.swift` 作为哈希输入之一。⚠️ 更正：该文件并未被版本管理
      #   （见 apps/mobile/.gitignore:30 —— Capacitor CLI 每次 `cap sync` 都会重写这份 SPM 清单，
      #   它会写入本机 node_modules 的绝对/相对路径，提交后在别的机器/CI 上路径必然失效，故不纳入
      #   版本管理、交给 cap sync 现场生成）。但它正是第 12 步 `Capacitor sync` 现场生成的，而本步骤
      #   排在其后，因此 `hashFiles()` 能取到真实的依赖指纹，不会退化成空串。它显式列出了
      #   capacitor-swift-pm 8.1.0 及两个本地 path 依赖，足以代表 SPM 依赖指纹。
      # ⚠️ 又因它是生成物（万一某次 `pnpm sync` 异常未生成，key 会退化），key 里同时加入恒被
      #   版本管理的 pnpm-lock.yaml：`hashFiles` 接受多个参数，任一文件缺失时它对该文件返回空串、
      #   其余仍参与计算，因此 key 不会整体退化为空串，也就不会误撞过期缓存。
      # 命中后 xcodebuild 可跳过 `swift package resolve` 的网络拉取，第二次运行起见效。
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build unsigned archive
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        run: |
          set -o pipefail

          # 提前体检：若可用空间不足 5GB，直接给出明确结论，
          # 避免 xcodebuild 在磁盘写满时抛出难以排查的报错。
          AVAIL_KB=$(df -k / | awk 'NR==2 {print $4}')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available disk: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 5 ]; then
            echo "::error::磁盘不足（仅剩 ${AVAIL_GB} GB）。本仓库 Git 历史过大，请参考 workflow 顶部注释。"
            du -sh . 2>/dev/null || true
            exit 1
          fi

          # 根据探测结果决定用 -workspace 还是 -project
          if [ "${{ steps.ios.outputs.mode }}" = "workspace" ]; then
            TARGET_FLAG="-workspace"
          else
            TARGET_FLAG="-project"
          fi

          # CODE_SIGNING_ALLOWED=NO 是核心：没有证书也能编译出 .app
          #
          # P0-2：只编 arm64 + 关闭调试符号。
          #   - 侧载到真机只需 arm64；原值 ONLY_ACTIVE_ARCH=NO 会 arm64 + x86_64 双架构编译，
          #     白白多花一份时间，因此改为 ONLY_ACTIVE_ARCH=YES。
          #   - 必须显式再给 ARCHS=arm64 与 EXCLUDED_ARCHS：在 `generic/platform=iOS`
          #     destination 下 ONLY_ACTIVE_ARCH 有时会被忽略，不显式指定 ARCHS 会报
          #     "No architectures to compile for ..."。
          #   - DEBUG_INFORMATION_FORMAT=dwarf + GCC_GENERATE_DEBUGGING_SYMBOLS=NO：跳过 dSYM
          #     生成（侧载 ipa 用不到符号表）。COPY_PHASE_STRIP / STRIP_INSTALLED_PRODUCT：
          #     剥离已安装产物，在关闭 DEBUG_INFO 后可以安全生效。
          #   - -quiet：减少 CI 日志 I/O（原有 `set -o pipefail` 保留）。
          #   - -clonedSourcePackagesDirPath：把 SPM 依赖检出指向缓存目录（见上一步 Cache SPM packages）。
          # ❌ 故意不加 DEPLOYMENT_POSTPROCESSING=YES：它会触发额外 strip 后处理，某些第三方
          #   Swift 包在链接期依赖符号表时可能报错，收益不明确、风险明确，本次不做。
          # 其余签名相关参数（CODE_SIGNING_ALLOWED/REQUIRED、CODE_SIGN_IDENTITY/ENTITLEMENTS、
          # AD_HOC_CODE_SIGNING_ALLOWED）与 -derivedDataPath 一律原样保留。
          xcodebuild \
            $TARGET_FLAG "${{ steps.ios.outputs.target }}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="i386 x86_64" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            -quiet \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found. Build output:"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"

          IPA_NAME="noname-ios-full-unsigned"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"

          # 顺手剥掉 macOS 的扩展属性文件，减小体积
          find "$BUILD_DIR/Payload" -name "._*" -delete || true

          cd "$BUILD_DIR"
          # 压缩级别说明（实测后已回退，勿再改回 -1）：曾试过 `zip -1`（level 1），A/B 实测
          # `Package unsigned IPA` 只从 21s 降到 20s（约 1s，落在噪声范围内），却让 ipa 从
          # 293,322,687 字节涨到 298,350,006 字节（+5.0MB, +1.7%）。本项目用户是在 30-100 KB/s
          # 的慢链路上手工下载该包，多 5MB 约等于多等 1-2 分钟，而 CI 只快 1 秒 —— 对该项目属
          # 负收益，故回退为默认级别（`-qry`）。
          # ❌ 故意不用 ditto -c -k --sequesterRsrc：--sequesterRsrc 会写入 __MACOSX
          #    资源叉条目，侧载工具对 ipa 内部结构敏感，不值得冒这个险。
          # 保留 -x 排除项，语义与原始一致（额外显式排除 .DS_Store）。
          zip -qry "$IPA_NAME.ipa" Payload -x '*.DS_Store' -x '*/._*'

          echo "IPA size:"
          du -h "$IPA_NAME.ipa"
          ls -lh "$IPA_NAME.ipa"

          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload full IPA to Release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # 精简任务并行执行，通常 3-5 分钟创建 Release；这里最多等待 10 分钟。
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG 已就绪"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::等待 Release $TAG 超时（精简任务可能失败，见同一次运行的另一个作业）"
              exit 1
            fi
            echo "等待 Release $TAG…（$i/60）"
            sleep 10
          done
          echo "附加完整包到 Release：$TAG"
          gh release upload "$TAG" "$IPA_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          ls -lh "$IPA_PATH"
          {
            echo "## iOS 完整包（full assets）✅"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 产物 | \`noname-ios-full-unsigned.ipa\` |"
            echo "| 大小 | $(du -h "$IPA_PATH" | cut -f1) |"
            echo "| Release | \`$TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
