name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and full packages
        shell: bash
        run: |
          mkdir -p release
          pnpm generateTestPack

          cd output/testpack
          7z a ../../release/noname.core.zip *

          cd ../../dist
          7z a ../release/noname.full.zip *

      - name: Upload Temporary Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            release/noname.core.zip
            release/noname.full.zip
          retention-days: 1

  build-installer:
    name: Build Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build Windows installer
        shell: bash
        run: |
          mkdir -p release
          pnpm build

          pnpm -F @noname/electron build:win
          EXE="$(find output -maxdepth 1 -name '*.exe' | head -n 1)"
          cp "$EXE" "release/noname.Setup.${VER}.exe"

      - name: Upload Temporary Installer
        uses: actions/upload-artifact@v7
        with:
          name: release-installer
          path: release/*.exe
          retention-days: 1

  release:
    name: Release Version
    runs-on: ubuntu-latest
    needs:
      - build-packages
      - build-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Temporary Files
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            "release/noname.core.zip" \
            "release/noname.full.zip" \
            "release/noname.Setup.*.exe" \
            --title "$TAG" \
            --notes-file apps/core/game/updateLog.md
