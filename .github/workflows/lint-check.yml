name: Lint Check

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESLint Check
            script: lint
          - name: Prettier Check
            script: lint:prettier
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch base branch (shallow)
        run: git fetch --no-tags --depth=1 origin "$BASE_REF:$BASE_REF"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.name }}
        run: pnpm --filter "...[$BASE_REF]" --filter "!./" run --if-present ${{ matrix.script }}
