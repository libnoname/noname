name: Sync with upstream

# 用途：让本 Fork 与上游 libnoname/noname 保持同步，不用手动点「Sync fork」。
#
# 覆盖分支：每晚自动枚举本 Fork 的全部现有分支（每分支一个独立任务），
#     唯一排除 build-output（构建产物分支，由 build.yml 强推维护，不参与上游同步）。
#     新增分支无需改本文件——创建后会自动纳入下一次同步。
# 同步源：与本工作流所用的 merge-upstream 接口（即网页「Sync fork」按钮）的实际语义对齐——
#     上游存在同名分支时，同步「上游的同名分支」；否则回退「上游 main」。
#     例：fork 的 maint/v1.11.4 ← 上游 maint/v1.11.4；fork 的 feat/web-pages ← 上游 main。
#     每条分支的任务日志与运行摘要都会写明本次用的同步源。
# ⚠️ 每个分支都要单独同步——这些分支是分叉的，不是包含关系：
#     历史教训（2026-10-05）：当时只同步 main，结果 iOS 包（从 feat/ios-support 构建）
#     缺了上游新增的 21 个资源文件——批量下载清单是构建时按分支自己的资源生成的；
#     feat/web-pages 同理（产物 dist 按分支资源构建，漏同步会缺素材）。
#     因此现在的策略是「全分支覆盖」，任何一条都不会落单。
#
# 触发：
#   - 每天 UTC 16:00（= 北京时间 00:00）自动跑一次（每晚一次，覆盖全部分支）；
#   - 也可以手动 Run workflow（同样覆盖全部分支）。
#
# 实现在服务端完成，不需要把仓库拉下来：
#   - 比较：GET /repos/{fork}/compare/main...{upstream-owner}:main
#     （跨 fork 比较时，head 位置写 owner:branch，且 owner 只能用
#       owner 名，写成 `owner/repo:branch` 会 404——两种写法都实测过）
#   - 合并：POST /repos/{fork}/merge-upstream  （就是网页上「Sync fork」按钮调的那个接口）
# 这样做是必须的——本仓库工作树接近 3GB（资源文件为主），就算浅克隆也很容易把
# 免费 runner 的磁盘吃满，再叠加一次三方合并基本没戏。
#
# 比较结果的字段含义（base=本 Fork、head=上游，别记反）：
#   - `ahead_by`  = 上游领先本 Fork 的提交数 → 就是本次要拉进来的量
#   - `behind_by` = 本 Fork 独有的提交数（自定义改动）
#
# ---------------------------------------------------------------------------
# ⚠️ 关于 SYNC_TOKEN（重要，第一次实跑时踩出来的）
#
# Actions 内置的 GITHUB_TOKEN 属于 GitHub App 安装令牌，无权创建或修改
# `.github/workflows/` 下的文件，而且权限清单里根本没有对应项可开。于是当上游的
# 更新里包含工作流改动时，合并会被直接拒绝：
#     refusing to allow a GitHub App to create or update workflow
#     `.github/workflows/release.yml` without `workflows` permission (422)
#
# 因此：
#   - 上游只改普通文件时（绝大多数日子），GITHUB_TOKEN 就够用，什么都不用配；
#   - 一旦上游动了 .github/workflows/，就需要一个带 `workflow` 权限的令牌。
#
# 需要时按下面做一次即可（约 2 分钟）：
#   1. 生成细粒度 PAT：https://github.com/settings/personal-access-tokens/new
#      → Repository access 选 only `cklsit/noname`
#      → Permissions 给 Contents: Read and write 与 Workflows: Read and write
#      （用经典令牌也行：勾 `repo` + `workflow`）
#   2. 存成本仓库的 Actions secret，名称填 `SYNC_TOKEN`：
#      Settings → Secrets and variables → Actions → New repository secret
#   3. 之后本工作流会自动优先使用它（见下方 GH_TOKEN）。
#
# 没配也没关系：那种情况下本次运行会失败并打印上面这条明确原因，
# 你手动点一次网页上的「Sync fork」即可（浏览器用你本人的身份，不受此限制）。
#
# 其它容易踩的点：
#   1. GitHub 的 schedule 只会在默认分支上执行。因此这个文件必须存在于
#      fork 的 main 上；只放在功能分支里，定时任务永远不会被触发。
#   2. 合并是合并而不是重置：本 Fork 的 main 有一批自定义提交
#      （README 改写、ios-build.yml、移除调研文档等），不会被上游覆盖。
#      若上游恰好改到同一批文件，会产生冲突 → 该次运行同样会失败并打印原因。
#      这是刻意设计的：宁可报错，也不冒险强推。
#   3. 定时任务在仓库连续 60 天没有任何提交活动后会被 GitHub 自动停用，
#      届时 Actions 页面会出现提示，重新启用即可。
#   4. 复刻仓库（fork）的定时工作流可能被平台自动禁用（GitHub 的 fork 资源策略，
#      2026-10-15 就发生过一次全量停摆）。若发现 nightly 不再触发，到 Actions 页面
#      把本工作流重新 Enable 即可；手动 Run workflow 不受影响。

on:
  schedule:
    # cron 一律使用 UTC。中国没有夏令时，UTC 16:00 恒等于北京时间次日 00:00。
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write # merge-upstream 需要写权限

jobs:
  # 前置：运行时枚举本 Fork 的全部现有分支（排除 build-output），供同步矩阵使用。
  # 新增分支无需修改本文件——下一次运行会自动纳入。
  list-branches:
    name: List all branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.list.outputs.branches }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: 枚举分支（排除 build-output）
        id: list
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          FORK: ${{ github.repository }}
        run: |
          set -euo pipefail
          all=$(gh api "repos/$FORK/branches?per_page=100" --paginate --jq '.[].name' | sort)
          names=$(printf '%s\n' "$all" | grep -v -x 'build-output' || true)
          if [ -z "$names" ]; then
            echo "::error::未枚举到任何可同步分支（异常，请检查）"
            exit 1
          fi
          # 生成 JSON 数组供 matrix.fromJSON 使用（分支名不含引号/反斜杠，直接包裹即可）
          json="[$(printf '%s\n' "$names" | sed 's/.*/"&"/' | tr '\n' ',' | sed 's/,$//')]"
          echo "branches=$json" >> "$GITHUB_OUTPUT"
          count=$(printf '%s\n' "$names" | grep -c .)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "本次将同步的分支（共 $count 个）："
          printf '%s\n' "$names" | sed 's/^/  - /'

  sync:
    name: Sync ${{ matrix.branch }} from upstream
    needs: list-branches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 每个分支一个独立任务，互不影响（fail-fast=false 让单个分支失败不牵连其它）
    strategy:
      fail-fast: false
      matrix:
        # 分支列表由前置任务在运行时自动枚举（fork 全部现有分支，排除 build-output）
        branch: ${{ fromJSON(needs.list-branches.outputs.branches) }}

    # 同一分支同时只允许一个同步任务（按分支分组，各分支可并行）
    concurrency:
      group: sync-upstream-${{ matrix.branch }}
      cancel-in-progress: false

    env:
      # 优先用带 workflow 权限的 PAT；没配就退回内置令牌（见文件头说明）
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      FORK: ${{ github.repository }}
      UPSTREAM: libnoname/noname
      UPSTREAM_OWNER: libnoname
      # UPSTREAM_BRANCH 是「回退用」的默认同步源（上游 main）。
      # 若上游存在与 $BRANCH 同名的分支，则以同名分支为准——该探测在 compare 步骤完成，
      # 与 merge-upstream / 网页「Sync fork」的实际语义一致（否则终态校验会误判失败）。
      UPSTREAM_BRANCH: main
      BRANCH: ${{ matrix.branch }}

    steps:
      - name: 比较上游与 Fork
        id: compare
        run: |
          set -euo pipefail

          # 分支名中的 # 在 URL 里会被当作锚点截断，路径参数必须转义（%23）
          BRANCH_ENC=$(printf '%s' "$BRANCH" | sed 's/#/%23/g')

          # 自检：确认当前用的到底是哪个令牌。内置 GITHUB_TOKEN 的身份是
          # github-actions[bot]，配了 SYNC_TOKEN 则显示你自己的用户名。
          # 这条日志的价值在于：一旦合并被「workflows permission」拒绝，
          # 看这里就知道是「PAT 没生效」还是「PAT 权限不够」。
          actor=$(gh api /user --jq '.login' 2>/dev/null || echo "unknown")
          if [ "$actor" = "github-actions[bot]" ]; then
            echo "::warning::当前使用内置 GITHUB_TOKEN（未配置 SYNC_TOKEN）：上游若改动 .github/workflows/ 下的文件，本次合并会被拒绝"
          else
            echo "::notice::当前使用 SYNC_TOKEN（身份：$actor）"
          fi

          # 同步源探测：上游存在同名分支 → 用同名分支；否则回退上游默认分支 main。
          # （merge-upstream / 网页「Sync fork」的实际语义即「同名优先、回退默认」，
          #   本工作流与之对齐，避免把「已同步成功」误判为失败。）
          if upstream_sha=$(gh api "repos/$UPSTREAM/commits/$BRANCH_ENC" --jq .sha 2>/dev/null); then
            SYNC_SOURCE="$BRANCH"
            SYNC_LABEL="上游同名分支"
          else
            SYNC_SOURCE="$UPSTREAM_BRANCH"
            SYNC_LABEL="上游 main（回退）"
            upstream_sha=$(gh api "repos/$UPSTREAM/commits/$UPSTREAM_BRANCH" --jq .sha)
          fi
          SRC_ENC=$(printf '%s' "$SYNC_SOURCE" | sed 's/#/%23/g')
          echo "sync_source=$SYNC_SOURCE" >> "$GITHUB_OUTPUT"
          echo "sync_label=$SYNC_LABEL" >> "$GITHUB_OUTPUT"

          fork_sha=$(gh api "repos/$FORK/commits/$BRANCH_ENC" --jq .sha)

          echo "同步源 $UPSTREAM/$SYNC_SOURCE（$SYNC_LABEL）= $upstream_sha"
          echo "本 Fork $FORK/$BRANCH = $fork_sha"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"

          # ⚠️ 判据是「上游是否领先本 Fork」，不能用「两边 SHA 是否相等」：
          # 本 Fork 有自己的提交，一旦合并过一次，两边 SHA 就再也不会相等了，
          # 那样每天都会白跑一次合并（接口会回 merge_type=none，但没有任何意义）。
          compare_api="repos/$FORK/compare/$BRANCH_ENC...$UPSTREAM_OWNER:$SRC_ENC"
          ahead=$(gh api "$compare_api" --jq .ahead_by 2>/dev/null || echo "")
          case "$ahead" in
            ''|*[!0-9]*)
              # 比较接口不可用时退回 SHA 判断：宁可多跑一次合并，也不要漏同步
              echo "::warning::比较接口不可用，退回 SHA 判断"
              if [ "$upstream_sha" = "$fork_sha" ]; then ahead=0; else ahead=1; fi
              ;;
          esac
          echo "上游领先本 Fork $ahead 个提交"

          if [ "$ahead" = "0" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "::notice::上游没有新提交，无需同步"
            exit 0
          fi
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"

          # 下面只是给人看的补充信息。万一接口不可用也不该让整次运行失败，一律兜底。
          echo "----- 与上游的差距 -----"
          gh api "$compare_api" \
            --jq '"上游领先 " + (.ahead_by|tostring) + " 个提交；本 Fork 另有 " + (.behind_by|tostring) + " 个自定义提交" + (if .status == "diverged" then "（已分叉，将产生一个合并提交）" else "" end)' \
            2>/dev/null || echo "(无法获取差距信息，继续尝试合并)"
          gh api "$compare_api" \
            --jq '.commits[] | "  * " + .sha[0:8] + " " + (.commit.message | split("\n")[0])' \
            2>/dev/null | head -20 || true

          # 上游这次是否动到了工作流文件？动到了就需要 PAT（见文件头说明）
          touched=$(gh api "$compare_api" \
            --jq '[.files[]? | select(.filename | startswith(".github/workflows/"))] | length' \
            2>/dev/null || echo "0")
          echo "上游本次改动的工作流文件数：$touched"
          echo "workflows_touched=$touched" >> "$GITHUB_OUTPUT"

      - name: 合并上游更新
        id: merge
        if: steps.compare.outputs.up_to_date != 'true'
        run: |
          set -uo pipefail

          echo "开始合并 $UPSTREAM → $FORK:$BRANCH（合并接口会自动选择：上游同名分支优先、回退 main）"

          if response=$(gh api -X POST "repos/$FORK/merge-upstream" -f branch="$BRANCH" 2>&1); then
            echo "$response"
            # 用 sed 而不是 jq 解析：这里需要「失败时原样打印响应体」，
            # 而 `gh api --jq` 只能解析成功响应；也不假设 runner 上装了 jq。
            merge_type=$(printf '%s' "$response" | tr -d ' \n' | sed -n 's/.*"merge_type":"\([^"]*\)".*/\1/p')
            echo "merge_type=${merge_type:-unknown}" >> "$GITHUB_OUTPUT"
            echo "::notice::已同步上游更新（merge_type=${merge_type:-unknown}）"
            exit 0
          fi

          echo "$response"

          # ① 最常见的一种失败：合并要改动工作流文件，而内置令牌无此权限
          if printf '%s' "$response" | grep -q "workflows. permission"; then
            echo "::error::本次合并需要改动 .github/workflows/ 下的文件，而 Actions 内置的 GITHUB_TOKEN 无权修改工作流文件（GitHub 硬限制，权限清单里没有对应项）。"
            echo "::error::解决办法：生成一个有 workflow 权限的 PAT，存成本仓库 secret「SYNC_TOKEN」，本工作流会自动改用它（步骤见本文件顶部注释）。"
            echo "::error::急用可先手动点网页上的「Sync fork」按钮（浏览器用你本人的身份，不受此限制）。"
            exit 1
          fi

          # ② 其次是冲突：Fork 的自定义提交与上游改动撞在同一批文件。
          #    这里刻意直接失败，而不是改用强推——强推会丢掉 Fork 的自定义提交。
          echo "::error::自动合并失败（多为冲突：本 Fork 的自定义提交与上游改到了同一批文件）。请手动处理："
          echo "::error::  git fetch upstream && git merge upstream/main   # 解决冲突后 push"
          exit 1

      - name: 核对合并结果
        id: verify
        if: steps.compare.outputs.up_to_date != 'true' && steps.merge.outcome == 'success'
        run: |
          set -euo pipefail

          BRANCH_ENC=$(printf '%s' "$BRANCH" | sed 's/#/%23/g')
          SYNC_SOURCE="${{ steps.compare.outputs.sync_source }}"
          SRC_ENC=$(printf '%s' "$SYNC_SOURCE" | sed 's/#/%23/g')

          new_sha=$(gh api "repos/$FORK/commits/$BRANCH_ENC" --jq .sha)
          echo "同步后 $FORK/$BRANCH = $new_sha"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"

          # 合并完成后，「上游领先」应当归零；否则还有上游提交没进来
          # 注意字段方向：base=本 Fork、head=上游，所以看的是 ahead_by
          compare_api="repos/$FORK/compare/$BRANCH_ENC...$UPSTREAM_OWNER:$SRC_ENC"
          gh api "$compare_api" --jq '"status=" + .status + " 同步源仍领先 " + (.ahead_by|tostring) + " 个提交；本 Fork 自定义提交 " + (.behind_by|tostring) + " 个"'

          remaining=$(gh api "$compare_api" --jq .ahead_by)
          if [ "$remaining" != "0" ]; then
            echo "::error::合并后同步源仍领先 $remaining 个提交（源：$SYNC_SOURCE），请手动检查"
            exit 1
          fi
          echo "::notice::已确认与同步源一致（$SYNC_SOURCE 领先 0 个提交）"

      - name: 写入运行摘要
        if: always()
        env:
          UP_TO_DATE: ${{ steps.compare.outputs.up_to_date }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          MERGE_TYPE: ${{ steps.merge.outputs.merge_type }}
          NEW_SHA: ${{ steps.verify.outputs.new_sha }}
          FORK_SHA: ${{ steps.compare.outputs.fork_sha }}
          WORKFLOWS_TOUCHED: ${{ steps.compare.outputs.workflows_touched }}
          SYNC_LABEL: ${{ steps.compare.outputs.sync_label }}
          SYNC_SOURCE: ${{ steps.compare.outputs.sync_source }}
        run: |
          {
            echo "## 上游同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 同步源 | ${SYNC_LABEL:-未知}：\`$UPSTREAM:${SYNC_SOURCE:-未知}\` |"
            echo "| 本 Fork | \`${FORK_SHA:-未知}\` → \`${NEW_SHA:-未变化}\` |"
            echo "| 上游改动的工作流文件 | ${WORKFLOWS_TOUCHED:-0} 个 |"
            if [ "$UP_TO_DATE" = "true" ]; then
              echo "| 结论 | 上游无新提交，未做改动 |"
            elif [ "$MERGE_OUTCOME" = "success" ]; then
              echo "| 结论 | 已同步（merge_type: ${MERGE_TYPE:-未知}） |"
            else
              echo "| 结论 | ❌ 合并失败，见上方日志 |"
            fi
            echo ""
            echo "> 手动同步等价操作：在 Fork 页面点 **Sync fork**，或本地 \`git fetch upstream && git merge upstream/main\`。"
            echo "> 若失败原因是「无权修改工作流文件」，需要配一个有 workflow 权限的 \`SYNC_TOKEN\`（见本文件顶部注释）。"
          } >> "$GITHUB_STEP_SUMMARY"
