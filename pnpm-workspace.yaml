packages:
  - apps/*
  - packages/*
  - packages/extension/*

allowBuilds:
  core-js-bundle: set this to true or false
  electron: true
  electron-winstaller: true
  esbuild: true

onlyBuiltDependencies:
  - core-js-bundle
  - electron
  - electron-winstaller
  - esbuild

sharedWorkspaceLockfile: false
